[package]
name = "midtrans-webhooker"
version = "1.0.0"
edition = "2021"
authors = ["HDHR"]
description = "High-performance Midtrans webhook relay for Discord & Lark"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "matched-path"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
subtle = "2.6"
rsa = { version = "0.9", features = ["sha2"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
bytes = "1.9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
